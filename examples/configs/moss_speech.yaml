# MOSS-Speech V1 baseline (single A800-80G, AR BF16, codec FP32).
# Native AR, 40 KV layers; TP=1 and eager execution.
# P4 eager budget: prompt <=512 grid rows, generation <=512, context <=1024.
# AR running <=4, waiting <=20; HTTP overflow returns 503.
# KV pool capped at 4096 positions (4 * 1024), avoiding unused eager reserve.
# Longer contexts require separate memory/parity qualification.
#
# Assets: model_path is the materialized AR/tokenizer dir; the codec resolves
# to the sibling "<model_path>-Codec" directory (override per factory args in
# sglang_omni/models/moss_speech/config.py if a different layout is used).
config_cls: MossSpeechPipelineConfig
name: moss-speech-a800-80g
model_path: /remote-home1/xrluan/SGLang_experiments/models/MOSS-Speech

endpoints:
  base_path: /remote-home1/xrluan/SGLang_experiments/artifacts/p2/runtime

env_defaults:
  MOSS_SPEECH_VOICE_WAV: /remote-home1/xrluan/SGLang_experiments/repos/MOSS-Speech/assets/prompt-cn.wav

# V1 boundary (plan §0): TP=1, eager, radix cache / CUDA graph / torch.compile
# disabled — enforced by the ar_engine factory's server args.
